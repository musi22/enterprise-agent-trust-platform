version: "3.8"

# ============================================================
# Enterprise Agent Trust & Evaluation Platform
# One-command full-stack: docker compose up --build
# ============================================================

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: enterprise-ai-api
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/commerce_lab.db
      JWT_SECRET_KEY: super-secret-enterprise-agent-lab-jwt-token-key-32chars
      DEFAULT_MODEL_PROVIDER: 
      GEMINI_API_KEY: 
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - apidata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: enterprise-ai-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  apidata:
